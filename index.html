<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0877bd">
<title>NU EXPORTS</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6f9;
  color:#26384a;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}

.header{
  background:linear-gradient(135deg,#0877bd,#08a8d8);
  color:white;
  text-align:center;
  padding:22px;
  border-radius:18px;
  margin-bottom:15px;
}

.header h1{
  margin:0;
  font-size:30px;
}

.header p{
  margin:6px 0 0;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:15px;
}

.dashboard-box{
  background:white;
  padding:15px 5px;
  text-align:center;
  border-radius:14px;
  box-shadow:0 2px 8px #d5dce2;
  cursor:pointer;
  transition:.2s;
}

.dashboard-box:active{
  transform:scale(.97);
}

.dashboard-box strong{
  display:block;
  font-size:28px;
  margin-top:5px;
}

.dashboard-box.active{
  outline:3px solid #0877bd;
}

.card{
  background:white;
  padding:18px;
  border-radius:16px;
  margin-bottom:15px;
  box-shadow:0 2px 9px #d5dce2;
}

h2{
  margin-top:0;
  color:#31547c;
}

label{
  display:block;
  font-weight:bold;
  margin-top:12px;
  margin-bottom:5px;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #cbd4dc;
  border-radius:9px;
  font-size:16px;
  background:white;
}

.search{
  border:2px solid #0877bd;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:18px;
}

button{
  border:0;
  border-radius:9px;
  padding:13px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.save{
  background:#0877bd;
  color:white;
}

.update{
  background:#159447;
  color:white;
}

.clear{
  background:#777;
  color:white;
}

.back{
  background:#555;
  color:white;
  margin-bottom:12px;
}

.table-container{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:950px;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

th{
  background:#0877bd;
  color:white;
}

.pending-text{
  color:#e49a00;
  font-weight:bold;
}

.delivered-text{
  color:#159447;
  font-weight:bold;
}

.action{
  color:white;
  padding:7px 9px;
  border-radius:7px;
  margin:2px;
  font-size:13px;
}

.edit{
  background:#0877bd;
}

.status{
  background:#159447;
}

.delete{
  background:#d93636;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

@media(max-width:600px){

  .dashboard{
    grid-template-columns:repeat(3,1fr);
  }

  .dashboard-box{
    font-size:12px;
  }

  .dashboard-box strong{
    font-size:23px;
  }

  .header h1{
    font-size:25px;
  }

  .buttons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">
  <h1>NU EXPORTS</h1>
  <p>Transport & Parcel Management</p>
</div>


<!-- DASHBOARD -->

<div class="dashboard">

  <div
    class="dashboard-box active"
    id="totalCard"
    onclick="filterDashboard('all')"
  >
    📦 Total Parcels
    <strong id="totalCount">0</strong>
  </div>

  <div
    class="dashboard-box"
    id="pendingCard"
    onclick="filterDashboard('Pending')"
  >
    ⏳ Pending Parcels
    <strong id="pendingCount">0</strong>
  </div>

  <div
    class="dashboard-box"
    id="deliveredCard"
    onclick="filterDashboard('Delivered')"
  >
    ✅ Delivered Parcels
    <strong id="deliveredCount">0</strong>
  </div>

</div>


<!-- FORM -->

<div class="card">

<h2>📦 Parcel Details</h2>

<label>LR Number *</label>

<input
  type="text"
  id="lrNumber"
  placeholder="Enter LR Number"
>


<label>Transport Name *</label>

<input
  type="text"
  id="transportName"
  placeholder="Enter Transport Name"
>


<label>Number of Articles *</label>

<input
  type="number"
  id="articles"
  placeholder="Enter Number of Articles"
  min="1"
>


<label>Freight Amount</label>

<input
  type="number"
  id="freight"
  placeholder="₹ 0"
  min="0"
>


<label>Local Freight Amount</label>

<input
  type="number"
  id="localFreight"
  placeholder="₹ 0"
  min="0"
>


<label>Booking Date</label>

<input
  type="date"
  id="bookingDate"
>


<label>Delivery Date</label>

<input
  type="date"
  id="deliveryDate"
>


<label>Delivery Status</label>

<select id="deliveryStatus">
  <option value="Pending">Pending</option>
  <option value="Delivered">Delivered</option>
</select>


<div class="buttons">

<button class="save" onclick="saveParcel()">
💾 SAVE
</button>

<button class="update" onclick="updateParcel()">
✏️ UPDATE
</button>

<button class="clear" onclick="clearForm()">
🧹 CLEAR
</button>

</div>

</div>


<!-- SEARCH -->

<div class="card">

<h2>🔎 Search Box</h2>

<input
  class="search"
  type="text"
  id="searchBox"
  placeholder="Search LR Number or Transport Name..."
  oninput="displayParcels()"
>

</div>


<!-- LIST -->

<div class="card">

<h2 id="listTitle">📋 All Parcels</h2>

<button
  class="back"
  id="backButton"
  onclick="filterDashboard('all')"
  style="display:none;"
>
← Show All Parcels
</button>


<div class="table-container">

<table>

<thead>

<tr>
<th>LR Number</th>
<th>Transport Name</th>
<th>Articles</th>
<th>Freight</th>
<th>Local Freight</th>
<th>Booking Date</th>
<th>Delivery Date</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody id="parcelTable"></tbody>

</table>

</div>


<div
  id="emptyMessage"
  class="empty"
  style="display:none;"
>
No parcels found.
</div>

</div>

</div>


<script>

/* =========================
   DATA
========================= */

let parcels =
JSON.parse(
  localStorage.getItem("NU_EXPORTS_DATA") || "[]"
);

let editingId = null;

let currentFilter = "all";


/* =========================
   SAVE DATA
========================= */

function saveData(){

  localStorage.setItem(
    "NU_EXPORTS_DATA",
    JSON.stringify(parcels)
  );

}


/* =========================
   NORMALIZE LR
========================= */

function normalizeLR(lr){

  return String(lr)
    .trim()
    .toLowerCase();

}


/* =========================
   READ FORM
========================= */

function readForm(){

  const lr =
    document.getElementById("lrNumber")
    .value
    .trim();

  const transport =
    document.getElementById("transportName")
    .value
    .trim();

  const articles =
    document.getElementById("articles")
    .value;


  if(!lr){

    alert("Please enter LR Number");

    return null;
  }


  if(!transport){

    alert("Please enter Transport Name");

    return null;
  }


  if(!articles){

    alert("Please enter Number of Articles");

    return null;
  }


  return {

    lrNumber:lr,

    transportName:transport,

    articles:Number(articles),

    freight:Number(
      document.getElementById("freight")
      .value || 0
    ),

    localFreight:Number(
      document.getElementById("localFreight")
      .value || 0
    ),

    bookingDate:
      document.getElementById("bookingDate")
      .value,

    deliveryDate:
      document.getElementById("deliveryDate")
      .value,

    status:
      document.getElementById("deliveryStatus")
      .value

  };

}


/* =========================
   DUPLICATE CHECK
========================= */

function isDuplicateLR(lr,ignoreId=null){

  const normalized =
    normalizeLR(lr);


  return parcels.some(parcel =>

    normalizeLR(parcel.lrNumber) === normalized

    &&

    parcel.id !== ignoreId

  );

}


/* =========================
   SAVE PARCEL
========================= */

function saveParcel(){

  const parcel =
    readForm();

  if(!parcel) return;


  /* DUPLICATE CHECK */

  if(isDuplicateLR(parcel.lrNumber)){

    alert(
      "⚠️ This LR Number already exists!\n\n" +
      "LR Number: " +
      parcel.lrNumber
    );

    return;
  }


  parcel.id =
    Date.now();


  parcels.push(parcel);

  saveData();

  clearForm();

  displayParcels();


  alert(
    "✅ Parcel Saved Successfully!"
  );

}


/* =========================
   EDIT PARCEL
========================= */

function editParcel(id){

  const parcel =
    parcels.find(
      item => item.id === id
    );


  if(!parcel) return;


  editingId = id;


  document.getElementById("lrNumber")
    .value = parcel.lrNumber;


  document.getElementById("transportName")
    .value = parcel.transportName;


  document.getElementById("articles")
    .value = parcel.articles;


  document.getElementById("freight")
    .value = parcel.freight;


  document.getElementById("localFreight")
    .value = parcel.localFreight;


  document.getElementById("bookingDate")
    .value = parcel.bookingDate;


  document.getElementById("deliveryDate")
    .value = parcel.deliveryDate;


  document.getElementById("deliveryStatus")
    .value = parcel.status;


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   UPDATE PARCEL
========================= */

function updateParcel(){

  if(editingId === null){

    alert(
      "First click Edit on a parcel"
    );

    return;
  }


  const updated =
    readForm();

  if(!updated) return;


  /* DUPLICATE CHECK
     Ignore the same parcel */

  if(
    isDuplicateLR(
      updated.lrNumber,
      editingId
    )
  ){

    alert(
      "⚠️ This LR Number already exists!\n\n" +
      "Please use another LR Number."
    );

    return;
  }


  const index =
    parcels.findIndex(
      item => item.id === editingId
    );


  if(index !== -1){

    parcels[index] = {

      ...parcels[index],

      ...updated

    };

  }


  saveData();

  clearForm();

  displayParcels();


  alert(
    "✅ Parcel Updated Successfully!"
  );

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

  document.getElementById("lrNumber")
    .value = "";

  document.getElementById("transportName")
    .value = "";

  document.getElementById("articles")
    .value = "";

  document.getElementById("freight")
    .value = "";

  document.getElementById("localFreight")
    .value = "";

  document.getElementById("bookingDate")
    .value = "";

  document.getElementById("deliveryDate")
    .value = "";

  document.getElementById("deliveryStatus")
    .value = "Pending";


  editingId = null;

}


/* =========================
   CHANGE STATUS
========================= */

function changeStatus(id){

  const parcel =
    parcels.find(
      item => item.id === id
    );


  if(!parcel) return;


  if(parcel.status === "Pending"){

    parcel.status = "Delivered";

  }
  else{

    parcel.status = "Pending";

  }


  saveData();

  displayParcels();

}


/* =========================
   DELETE
========================= */

function deleteParcel(id){

  if(
    !confirm(
      "Are you sure you want to delete this parcel?"
    )
  ){

    return;

  }


  parcels =
    parcels.filter(
      item => item.id !== id
    );


  saveData();

  displayParcels();

}


/* =========================
   DASHBOARD FILTER
========================= */

function filterDashboard(filter){

  currentFilter = filter;


  document
    .getElementById("totalCard")
    .classList.remove("active");


  document
    .getElementById("pendingCard")
    .classList.remove("active");


  document
    .getElementById("deliveredCard")
    .classList.remove("active");


  if(filter === "all"){

    document
      .getElementById("totalCard")
      .classList.add("active");

  }


  if(filter === "Pending"){

    document
      .getElementById("pendingCard")
      .classList.add("active");

  }


  if(filter === "Delivered"){

    document
      .getElementById("deliveredCard")
      .classList.add("active");

  }


  displayParcels();

}


/* =========================
   DISPLAY PARCELS
========================= */

function displayParcels(){

  const search =
    document.getElementById("searchBox")
    .value
    .toLowerCase()
    .trim();


  const table =
    document.getElementById("parcelTable");


  table.innerHTML = "";


  let filtered =
    parcels.filter(parcel => {


      const searchMatch =

        normalizeLR(
          parcel.lrNumber
        )
        .includes(search)

        ||

        parcel.transportName
          .toLowerCase()
          .includes(search);


      const statusMatch =

        currentFilter === "all"

        ||

        parcel.status === currentFilter;


      return searchMatch && statusMatch;

    });


  document.getElementById("emptyMessage")
    .style.display =
      filtered.length === 0
      ? "block"
      : "none";


  filtered.forEach(parcel => {


    const row =
      document.createElement("tr");


    const statusClass =

      parcel.status === "Pending"

      ? "pending-text"

      : "delivered-text";


    row.innerHTML = `

      <td>
        ${safe(parcel.lrNumber)}
      </td>

      <td>
        ${safe(parcel.transportName)}
      </td>

      <td>
        ${parcel.articles}
      </td>

      <td>
        ₹${parcel.freight}
      </td>

      <td>
        ₹${parcel.localFreight}
      </td>

      <td>
        ${parcel.bookingDate || "-"}
      </td>

      <td>
        ${parcel.deliveryDate || "-"}
      </td>

      <td class="${statusClass}">
        ${parcel.status}
      </td>

      <td>

        <button
          class="action edit"
          onclick="editParcel(${parcel.id})"
        >
          Edit
        </button>


        <button
          class="action status"
          onclick="changeStatus(${parcel.id})"
        >
          ${
            parcel.status === "Pending"
            ? "Delivered"
            : "Pending"
          }
        </button>


        <button
          class="action delete"
          onclick="deleteParcel(${parcel.id})"
        >
          Delete
        </button>

      </td>

    `;


    table.appendChild(row);

  });


  updateDashboard();


  const title =
    document.getElementById("listTitle");


  const back =
    document.getElementById("backButton");


  if(currentFilter === "Pending"){

    title.innerText =
      "⏳ Pending Parcels";

    back.style.display = "block";

  }

  else if(currentFilter === "Delivered"){

    title.innerText =
      "✅ Delivered Parcels";

    back.style.display = "block";

  }

  else{

    title.innerText =
      "📋 All Parcels";

    back.style.display = "none";

  }

}


/* =========================
   DASHBOARD COUNT
========================= */

function updateDashboard(){

  document.getElementById("totalCount")
    .textContent =
      parcels.length;


  document.getElementById("pendingCount")
    .textContent =
      parcels.filter(
        parcel =>
          parcel.status === "Pending"
      ).length;


  document.getElementById("deliveredCount")
    .textContent =
      parcels.filter(
        parcel =>
          parcel.status === "Delivered"
      ).length;

}


/* =========================
   SAFE TEXT
========================= */

function safe(value){

  return String(value || "")
    .replace(
      /[&<>"']/g,

      function(character){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[character];

      }

    );

}


/* =========================
   START APP
========================= */

displayParcels();

</script>

</body>
</html>
